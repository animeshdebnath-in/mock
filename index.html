<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animesh Test Series | Mock Hub</title>
<meta name="description" content="Animesh Test Series: SSC CGL mock tests for maths, English and reasoning.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230B2A5B'/%3E%3Cpath d='M14 50 L32 12 L50 50' fill='none' stroke='%23FFFFFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25 40 L30.5 45.5 L38 35' fill='none' stroke='%23F28C28' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f0fc; --ink:#14171f; --muted:#4f6079; --line:#c5d7ee;
  --accent:#2f5bea; --accent-ink:#ffffff; --hover:#d8e6f9;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.6 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px; margin:0 auto; padding:40px 24px 56px}

.brand{display:flex; align-items:center; justify-content:center; gap:14px; margin:0; text-decoration:none; color:#0b2a5b}
.brand svg{width:52px; height:52px; flex:none}
.brand .bt{display:flex; flex-direction:column; gap:5px}
.brand .bn{font-weight:700; font-size:1.7rem; line-height:1; letter-spacing:-.02em}
.brand .bs{font-weight:600; font-size:.68rem; line-height:1; letter-spacing:.34em; color:#c2410c}
.brand:focus-visible{outline:2px solid var(--accent); outline-offset:6px; border-radius:8px}
h1{margin:0 0 48px; font-size:inherit; line-height:1}

.quote{margin:0 auto 56px; max-width:26ch; text-align:center}
.quote blockquote{margin:0; font-size:clamp(1.5rem,5vw,2.1rem); font-weight:600; line-height:1.25; letter-spacing:-.02em; color:#0b2a5b}
.quote figcaption{margin-top:12px; color:var(--muted); font-size:.95rem}
.quote figcaption::before{content:"\2014\00a0"}

.group{margin:0 0 40px}
.group h2{font-size:.95rem; font-weight:600; color:var(--muted); margin:0 0 8px}
.item{border-top:1px solid var(--line)}
.group .item:last-child{border-bottom:1px solid var(--line)}

summary{
  list-style:none; display:flex; align-items:center; gap:16px;
  padding:20px 8px; cursor:pointer; border-radius:10px;
}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--hover)}
.name{flex:1; min-width:0}
.name b{display:block; font-size:1.2rem; font-weight:600; letter-spacing:-.01em}
.name span{color:var(--muted); font-size:.95rem}
.count{color:var(--muted); font-size:.95rem; white-space:nowrap}
.chev{width:18px; height:18px; flex:none; stroke:var(--muted); fill:none; stroke-width:2; transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}

.panel{padding:2px 8px 24px}
.empty{color:var(--muted); margin:4px 0 0}
.mock{
  display:flex; align-items:center; gap:16px; margin-top:10px;
  padding:14px 16px; border:1px solid var(--line); border-radius:12px;
}
.mock .t{flex:1; min-width:0}
.mock .t b{display:block; font-weight:600}
.mock .t span{color:var(--muted); font-size:.9rem}
.start{
  flex:none; background:var(--accent); color:var(--accent-ink); text-decoration:none;
  font-weight:600; font-size:.95rem; padding:9px 18px; border-radius:9px;
}
.start:hover{filter:brightness(1.08)}

summary:focus-visible,.start:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
footer{color:var(--muted); font-size:.9rem; margin-top:56px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .chev{transition:none}
}

.stats{display:flex; gap:12px; flex-wrap:wrap; margin:4px 0 14px}
.stat{flex:1; min-width:110px; padding:12px 14px; border:1px solid var(--line); border-radius:12px}
.stat b{display:block; font-size:1.3rem; font-weight:700; color:#0b2a5b}
.stat span{color:var(--muted); font-size:.85rem}
.tbl{overflow-x:auto}
.tbl table{width:100%; border-collapse:collapse; font-size:.92rem; min-width:680px}
.tbl th{text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px; border-bottom:1px solid var(--line)}
.pct{font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <h1>
    <a class="brand" href="./" aria-label="Animesh Test Series, home">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#0b2a5b"/>
        <path d="M14 50 L32 12 L50 50" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 40 L30.5 45.5 L38 35" fill="none" stroke="#f28c28" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="bt"><span class="bn">Animesh</span><span class="bs">TEST SERIES</span></span>
    </a>
  </h1>
  <figure class="quote">
    <blockquote>“Arise, awake, and stop not till the goal is reached.”</blockquote>
    <figcaption>Swami Vivekananda</figcaption>
  </figure>
  <div id="mocks"></div>
  <div id="scores"></div>
</main>

<script src="tracker.js"></script>
<script>
/* To add a mock, put an entry inside a section's mocks list, for example:
   {title:"RBE Mock 1", url:"mocks/rbe-1.html", questions:30, minutes:30}  */
const GROUPS = [
  {title:"Mathematics", sections:[
    {id:"rbe", name:"RBE Mock", sub:"Revolution By Education", mocks:[
      {title:"RBE Mock 1", url:"rbe-1.html", questions:30, minutes:30},
      {title:"RBE Mock 2", url:"rbe-2.html", questions:30, minutes:30},
      {title:"RBE Mock 3", url:"rbe-3.html", questions:30, minutes:30},
      {title:"RBE Mock 4", url:"rbe-4.html", questions:30, minutes:30},
      {title:"RBE Mock 5", url:"rbe-5.html", questions:30, minutes:30},
      {title:"RBE Mock 6", url:"rbe-6.html", questions:30, minutes:30}
    ]},
    {id:"blitz", name:"Blitz Mock", sub:"Fast, high-intensity practice sets", mocks:[
      {title:"Blitz Mock 1", url:"blitz-mock-1.html", questions:30, minutes:30},
      {title:"Blitz Mock 2", url:"blitz-mock-2.html", questions:30, minutes:30},
      {title:"Blitz Mock 3", url:"blitz-mock-3.html", questions:30, minutes:30},
      {title:"Blitz Mock 4", url:"blitz-mock-4.html", questions:30, minutes:30},
      {title:"Blitz Mock 5", url:"blitz-mock-5.html", questions:30, minutes:30},
      {title:"Blitz Mock 6", url:"blitz-mock-6.html", questions:30, minutes:30},
      {title:"Blitz Mock 7", url:"blitz-mock-7.html", questions:30, minutes:30}
    ]},
    {id:"maths",    name:"Other Mathematics Mock", sub:"Maths sets from other sources",      mocks:[
      {title:"The Pundit Maths Mock 05", url:"the-pundit-maths-mock-05.html", questions:30, minutes:30}
    ]}
  ]},
  {title:"English", sections:[
    {id:"english",  name:"English Mock",     sub:"English sets from other sources",    mocks:[
      {title:"The Pundit English Mock 01", url:"the-pundit-english-mock-01.html", questions:45, minutes:40},
      {title:"The Pundit English Mock 02", url:"the-pundit-english-mock-02.html", questions:45, minutes:40},
      {title:"The Pundit English Mock 03", url:"the-pundit-english-mock-03.html", questions:45, minutes:40},
      {title:"The Pundit English Mock 04", url:"the-pundit-english-mock-04.html", questions:45, minutes:40},
      {title:"The Pundit English Mock 05", url:"the-pundit-english-mock-05.html", questions:45, minutes:40}
    ]}
  ]},
  {title:"Reasoning", sections:[
    {id:"reasoning",name:"Reasoning Mock",         sub:"Verbal and non-verbal practice sets", mocks:[]}
  ]}
];

const root = document.getElementById("mocks");
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

GROUPS.forEach(g => {
  const grp = el("section", "group");
  grp.append(el("h2", null, g.title));

  g.sections.forEach(s => {
    const d = el("details", "item");
    d.id = s.id;

    const sm = el("summary");
    const nm = el("div", "name");
    nm.append(el("b", null, s.name), el("span", null, s.sub));
    const n = s.mocks.length;
    sm.append(nm, el("span", "count", n ? n + (n === 1 ? " mock" : " mocks") : "No mocks yet"));
    sm.insertAdjacentHTML("beforeend",
      '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>');

    const p = el("div", "panel");
    if (!n) p.append(el("p", "empty", "Mocks you add to this section will appear here."));
    s.mocks.forEach(m => {
      const row = el("div", "mock");
      const t = el("div", "t");
      t.append(el("b", null, m.title));
      const meta = [m.questions && m.questions + " questions", m.minutes && m.minutes + " minutes"]
        .filter(Boolean).join(", ");
      if (meta) t.append(el("span", null, meta));
      const a = el("a", "start", "Start test");
      a.href = m.url;
      row.append(t, a);
      p.append(row);
    });

    d.append(sm, p);
    grp.append(d);
  });
  root.append(grp);
});

function openFromHash() {
  const d = document.getElementById(location.hash.slice(1));
  if (d && d.tagName === "DETAILS") { d.open = true; d.scrollIntoView(); }
}
openFromHash();
addEventListener("hashchange", openFromHash);

/* ---------- Score history (reads from your Google Sheet) ---------- */
(function(){
  if (typeof SHEET_URL === "undefined" || !SHEET_URL || SHEET_URL.indexOf("PASTE") === 0) return;
  const box = document.getElementById("scores");
  const grp = el("section", "group");
  grp.append(el("h2", null, "Progress"));
  const d = el("details", "item"); d.id = "history";
  const sm = el("summary");
  const nm = el("div", "name");
  nm.append(el("b", null, "Score History"), el("span", null, "Every test you have submitted"));
  const cnt = el("span", "count", "Loading...");
  sm.append(nm, cnt);
  sm.insertAdjacentHTML("beforeend",'<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>');
  const p = el("div", "panel");
  p.append(el("p", "empty", "Loading your scores..."));
  d.append(sm, p); grp.append(d); box.append(grp);

  fetch(SHEET_URL + "?limit=100").then(r => r.json()).then(rows => {
    p.textContent = "";
    if (!Array.isArray(rows) || !rows.length) {
      cnt.textContent = "No attempts yet";
      p.append(el("p", "empty", "Submit a test and it will show up here."));
      return;
    }
    cnt.textContent = rows.length + (rows.length === 1 ? " attempt" : " attempts");
    const pcts = rows.map(r => Number(r.percent) || 0);
    const avg = (pcts.reduce((a, b) => a + b, 0) / pcts.length).toFixed(1);
    const best = Math.max.apply(null, pcts).toFixed(1);
    const stats = el("div", "stats");
    [[rows.length, "Attempts"], [avg + "%", "Average"], [best + "%", "Best"]].forEach(x => {
      const c = el("div", "stat"); c.append(el("b", null, x[0]), el("span", null, x[1])); stats.append(c);
    });
    p.append(stats);

    const wrap = el("div", "tbl"), t = el("table"), thead = el("thead"), hr = el("tr");
    ["Date", "Test", "Score", "%", "Time", "Wrong Qs", "Skipped Qs"].forEach(h => hr.append(el("th", null, h)));
    thead.append(hr); t.append(thead);
    const tb = el("tbody");
    rows.forEach(r => {
      const tr = el("tr");
      const dt = new Date(r.time);
      const mins = r.seconds ? Math.round(r.seconds / 60) + " min" : "-";
      [dt.toLocaleDateString("en-IN", {day:"numeric", month:"short"}) + " " +
         dt.toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"}),
       r.test, r.score + " / " + r.total, null, mins, r.wrong || "-", r.skipped || "-"].forEach((v, i) => {
        const td = el("td", i === 3 ? "pct" : null, v == null ? Number(r.percent).toFixed(1) + "%" : v);
        tr.append(td);
      });
      tb.append(tr);
    });
    t.append(tb); wrap.append(t); p.append(wrap);
  }).catch(() => {
    cnt.textContent = "Unavailable";
    p.textContent = "";
    p.append(el("p", "empty", "Could not load scores. Check the Apps Script URL and deployment access."));
  });
})();
</script>
</body>
</html>
